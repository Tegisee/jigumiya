name: Price Check Bot

on:
  schedule:
    - cron: '0 23 * * *'   # 08:00 KST
    - cron: '0 5 * * *'    # 14:00 KST
    - cron: '0 12 * * *'   # 21:00 KST
    - cron: '0 13 * * *'   # 22:00 KST — TEST: 테스트 완료 후 제거
    - cron: '5 13 * * *'   # 22:05 KST — TEST: 테스트 완료 후 제거
    - cron: '10 13 * * *'  # 22:10 KST — TEST: 테스트 완료 후 제거
    - cron: '15 13 * * *'  # 22:15 KST — TEST: 테스트 완료 후 제거
    - cron: '20 13 * * *'  # 22:20 KST — TEST: 테스트 완료 후 제거
    - cron: '25 13 * * *'  # 22:25 KST — TEST: 테스트 완료 후 제거
    - cron: '30 13 * * *'  # 22:30 KST — TEST: 테스트 완료 후 제거
  workflow_dispatch: {}     # 수동 실행

jobs:
  price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/price-checker
        run: npm install

      - name: Build TypeScript
        working-directory: scripts/price-checker
        run: npx tsc

      - name: Run price checker
        working-directory: scripts/price-checker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node dist/index.js
