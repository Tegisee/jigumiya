name: Price Check Bot

on:
  # 재활성화 (2026-04-23): 018 Functions Resolver 배포 + Secret trim/HTML 파싱 버그 수정 완료.
  # 비활성 이력: 2026-04-21 Rate Limit 2회 초과 → 2026-04-22 07:21 KST 자연 해제.
  # 아이고와 시간대 분리 (지금이야: 08/12/20 ↔ 아이고: 07/09/11/13/16/19)
  schedule:
    - cron: '0 23 * * *'   # 08:00 KST
    - cron: '0 3 * * *'    # 12:00 KST
    - cron: '0 11 * * *'   # 20:00 KST
  workflow_dispatch: {}

jobs:
  price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: scripts/price-checker
        run: npm install

      - name: Build TypeScript
        working-directory: scripts/price-checker
        run: npx tsc

      - name: Run price checker
        working-directory: scripts/price-checker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node dist/index.js
