name: Price Check Bot

on:
  # 비활성화 (2026-04-24): 오늘 과호출 의심 → Rate Limit 재발 방지 위해 긴급 차단.
  # 재활성화 이력: 2026-04-23 (18 Resolver 배포 후).
  # 이전 비활성 이력: 2026-04-21 Rate Limit 2회 초과 → 2026-04-22 자연 해제.
  # schedule:
  #   - cron: '0 23 * * *'   # 08:00 KST
  #   - cron: '0 3 * * *'    # 12:00 KST
  #   - cron: '0 11 * * *'   # 20:00 KST
  workflow_dispatch: {}

jobs:
  price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: scripts/price-checker
        run: npm install

      - name: Build TypeScript
        working-directory: scripts/price-checker
        run: npx tsc

      - name: Run price checker
        working-directory: scripts/price-checker
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node dist/index.js
